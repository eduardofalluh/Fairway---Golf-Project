[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The Next.js runtime turns the build into Netlify functions (API routes, ISR)
# and routing. Without it Netlify uploads `.next` as static files and every
# route 404s, which is what git-triggered builds did before this was declared.
[[plugins]]
  package = "@netlify/plugin-nextjs"
